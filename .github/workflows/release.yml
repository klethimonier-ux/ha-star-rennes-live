name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Version du tag = version du manifest
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(python3 -c "import json;print(json.load(open('custom_components/star_rennes_live/manifest.json'))['version'])")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "Tag v$TAG mais manifest en $MANIFEST" && exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
