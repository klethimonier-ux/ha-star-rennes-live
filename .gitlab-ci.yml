# Publication vers GitHub : poser un tag hacs-vX.Y.Z sur main
#   git tag hacs-v1.0.0 && git push origin hacs-v1.0.0
# Variable CI/CD requise : GITHUB_TOKEN (jeton GitHub, Contents + Workflows en écriture)

variables:
  GIT_DEPTH: 0                      # historique complet (GitHub refuse un clone partiel)
  GITHUB_REPO: "github.com/klethimonier-ux/ha-star-rennes-live.git"
  GITHUB_USER: "klethimonier-ux"
  # Identité publiée sur GitHub (adresse anonyme : l'e-mail réel ne quitte jamais GitLab)
  PUBLISH_NAME: "klethimonier-ux"
  PUBLISH_EMAIL: "251636846+klethimonier-ux@users.noreply.github.com"

publish-github:
  image:
    name: alpine/git
    entrypoint: [""]                # l'image lance « git » par défaut : on veut un shell
  rules:
    - if: '$CI_COMMIT_TAG =~ /^hacs-v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - VERSION="${CI_COMMIT_TAG#hacs-}"            # hacs-v1.0.0 -> v1.0.0
    # 0. Jeton présent et au bon format (sans jamais l'afficher)
    - '[ -n "$GITHUB_TOKEN" ] || { echo "GITHUB_TOKEN vide : variable absente, ou « protégée » alors que le tag ne l est pas"; exit 1; }'
    - 'case "$GITHUB_TOKEN" in github_pat_*|ghp_*) echo "Jeton GitHub présent (${#GITHUB_TOKEN} caractères)";; *) echo "GITHUB_TOKEN ne ressemble pas à un jeton GitHub (github_pat_… ou ghp_…)"; exit 1;; esac'
    - REMOTE="https://${GITHUB_USER}:${GITHUB_TOKEN}@${GITHUB_REPO}"
    # 1. Le tag doit être sur main
    - git fetch origin main
    - git merge-base --is-ancestor "$CI_COMMIT_SHA" origin/main || { echo "Tag hors de main, rien n'est publié"; exit 1; }
    # 2. La version du manifest doit correspondre au tag
    - MANIFEST="$(ls custom_components/*/manifest.json)"
    - '[ "$(echo "$MANIFEST" | wc -l)" -eq 1 ] || { echo "Il faut exactement un manifest.json : $MANIFEST"; exit 1; }'
    - MANIFEST_VERSION="$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' "$MANIFEST" | sed 's/.*"\([^"]*\)"$/\1/')"
    - '[ "v${MANIFEST_VERSION}" = "$VERSION" ] || { echo "Tag $VERSION mais manifest en ${MANIFEST_VERSION:-?} ($MANIFEST)"; exit 1; }'
    # 3. Copie de l'historique signée avec l'adresse anonyme (dates et contenu inchangés :
    #    le résultat est identique d'une publication à l'autre, main avance sans forcer)
    - git checkout -q -B publication "$CI_COMMIT_SHA"
    - export FILTER_BRANCH_SQUELCH_WARNING=1
    - git filter-branch -f --env-filter 'export GIT_AUTHOR_NAME="$PUBLISH_NAME" GIT_AUTHOR_EMAIL="$PUBLISH_EMAIL" GIT_COMMITTER_NAME="$PUBLISH_NAME" GIT_COMMITTER_EMAIL="$PUBLISH_EMAIL"' publication
    - PUBLISH_SHA="$(git rev-parse publication)"
    - git log --format='%h %an <%ae>' -3 publication
    # 4. Publication : branche de release, tag de version, main (sans écrasement)
    - git push "$REMOTE" "${PUBLISH_SHA}:refs/heads/release/${VERSION}"
    - git push "$REMOTE" "${PUBLISH_SHA}:refs/tags/${VERSION}"
    - git push "$REMOTE" "${PUBLISH_SHA}:refs/heads/main"
